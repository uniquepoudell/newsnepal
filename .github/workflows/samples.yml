name: Illustration samples (temporary)
on:
  push:
    branches: [claude/project-thread-tthqto]
    paths: [.github/workflows/samples.yml, scripts/illustrate.py]
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Make two sample illustrations from live headlines without pictures
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: |
          mkdir -p samples
          python - <<'PY'
          import json, sys, urllib.request
          sys.path.insert(0, "scripts")
          import illustrate
          cfg = json.load(open("config.json"))
          base = "https://uniquepoudell.github.io/newsnepal"
          picks = []
          for name in ("items.json", "visa-items.json"):
              data = json.loads(urllib.request.urlopen(base + "/" + name, timeout=30).read())["items"]
              picks += [i for i in data if not i.get("image")][:1]
          for n, it in enumerate(picks, 1):
              try:
                  img = illustrate.generate(it, cfg)
                  open(f"samples/sample{n}.jpg", "wb").write(img)
                  print("OK", n, it["title"], len(img))
              except Exception as e:
                  print("FAIL", n, it["title"], e)
              open(f"samples/sample{n}.txt", "w").write(it["title"] + "\n" + illustrate.make_prompt(it) + "\n")
          PY
      - name: Commit samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples && git commit -m "Add illustration samples" && git push || echo "nothing to commit"
