name: Illustration samples (temporary)
on:
  push:
    branches: [claude/project-thread-tthqto]
    paths: [.github/workflows/samples.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p samples
          base=https://uniquepoudell.github.io/newsnepal
          curl -sf "$base/items.json" -o samples/items.json
          curl -sf "$base/visa-items.json" -o samples/visa-items.json || true
          for id in 139ecec27fccdc29 667a501673fc38ec c15a6a6307fa9347 dc629999a5718c07 5b943a534036a311 b7439d57b4cbc803; do
            curl -sf "$base/gen/$id.jpg" -o "samples/$id.jpg" || echo "missing $id"
          done
          ls -la samples
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add samples && git commit -m "Add illustration samples" && git push
