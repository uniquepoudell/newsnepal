name: Illustration samples (temporary, run 2)
on:
  push:
    branches: [claude/project-thread-tthqto]
    paths: [.github/workflows/samples.yml]
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Make sample illustrations from live headlines without pictures
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: |
          mkdir -p samples
          python - <<'PY'
          import json, sys, urllib.request
          sys.path.insert(0, "scripts")
          import illustrate
          cfg = json.load(open("config.json"))
          base = "https://uniquepoudell.github.io/newsnepal"
          picks = []
          for name, n in (("items.json", 2), ("visa-items.json", 1)):
              data = json.loads(urllib.request.urlopen(base + "/" + name, timeout=30).read())["items"]
              picks += [i for i in data if not i.get("image")][:n]
          for n, it in enumerate(picks, 1):
              open(f"samples/sample{n}.txt", "w").write(it["title"] + "\n")
              try:
                  img = illustrate.generate(it, cfg)
                  open(f"samples/sample{n}.jpg", "wb").write(img)
                  print("OK", n, it["title"], len(img))
              except Exception as e:
                  print("FAIL", n, it["title"], e)
          PY
      - name: Commit samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples && git commit -m "Add illustration samples" && git push || echo "nothing to commit"
