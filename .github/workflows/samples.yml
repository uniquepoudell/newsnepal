name: Illustration samples (temporary)
on:
  push:
    branches: [claude/project-thread-tthqto]
    paths: [.github/workflows/samples.yml, scripts/illustrate.py]
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install --quiet pillow
      - run: |
          mkdir -p samples2
          curl -sf https://uniquepoudell.github.io/newsnepal/items.json -o /tmp/items.json
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "scripts")
          import illustrate
          cfg = json.load(open("config.json"))
          items = json.load(open("/tmp/items.json"))
          items = items if isinstance(items, list) else items.get("items", [])
          picked = [i for i in items if not i.get("image")][:3] + [i for i in items if i.get("category") in ("crypto", "global")][:3]
          for it in picked:
              try:
                  data = illustrate.generate(it, cfg)
                  open(f"samples2/{illustrate.story_id(it['link'])}.jpg", "wb").write(data)
                  print("ok", len(data), it["category"], it["title"][:80])
              except Exception as e:
                  print("fail", e)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add samples2 && git commit -m "Add illustration samples v2" && git push
